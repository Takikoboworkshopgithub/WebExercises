<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0c0914">
    <title>Webexercises</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- anime.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

    <!-- Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
    }
    </script>

    <style>
        :root {
            --bg: #0c0914;
            --surface: rgba(25, 19, 44, 0.68);
            --surface-hover: rgba(42, 32, 74, 0.82);
            --border: rgba(208, 188, 255, 0.15);
            --border-hover: rgba(208, 188, 255, 0.45);
            --primary: #d0bcff;
            --text: #f6f0ff;
            --muted: #b9aecf;
            --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: "Manrope", "Noto Sans JP", sans-serif;
            overflow: hidden;
        }

        /* ========================================
           Background layers
        ======================================== */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            background:
                radial-gradient(
                    ellipse at 50% 45%,
                    rgba(75, 45, 125, 0.16),
                    transparent 65%
                ),
                var(--bg);
        }

        /* Canvas particle layer */
        #particles {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        /* Three.js layer */
        #three-container {
            position: absolute;
            inset: 0;
            z-index: 1;
            opacity: 0.7;
        }

        #three-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Background glow */
        .ambient-glow {
            position: absolute;
            width: 45vw;
            height: 45vw;
            min-width: 300px;
            min-height: 300px;
            border-radius: 50%;
            background: radial-gradient(
                circle,
                rgba(130, 80, 220, 0.12),
                transparent 70%
            );
            filter: blur(30px);
            left: 50%;
            top: 45%;
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        /* ========================================
           Intro screen
        ======================================== */

        .intro-screen {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg);
        }

        .intro-title {
            font-size: clamp(2.5rem, 8vw, 6rem);
            font-weight: 800;
            letter-spacing: -0.06em;
            color: transparent;
            background: linear-gradient(
                120deg,
                #ffffff,
                #d0bcff 45%,
                #8b70d9
            );
            background-clip: text;
            -webkit-background-clip: text;
            opacity: 0;
            transform: translateY(20px);
        }

        .intro-line {
            position: absolute;
            bottom: 42%;
            width: 0;
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                #d0bcff,
                transparent
            );
            opacity: 0.7;
        }

        /* ========================================
           Main layout
        ======================================== */

        .app-container {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 1200px;
            height: 100vh;
            min-height: 550px;
            margin: 0 auto;
            padding: 2.5rem 5vw 2rem;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            opacity: 0;
            visibility: hidden;
        }

        /* Header */

        header {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .brand-icon {
            color: var(--primary);
            font-size: 1.3rem;
        }

        .brand-name {
            color: var(--text);
        }

        .header-label {
            margin-left: auto;
            color: var(--muted);
            font-size: 0.65rem;
            letter-spacing: 0.18em;
        }

        /* Main grid */

        main {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.25rem;
            width: 100%;
            margin: auto 0;
            padding: 2rem 0;
        }

        /* Chapter cards */

        .chapter-card {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;

            min-height: 190px;
            padding: 1.75rem 2rem;

            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            text-decoration: none;
            color: inherit;

            transition:
                border-color 0.3s,
                background 0.3s,
                transform 0.3s var(--ease),
                box-shadow 0.3s var(--ease);

            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
        }

        /* Hover highlight */

        .chapter-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                120deg,
                transparent,
                rgba(208, 188, 255, 0.07),
                transparent
            );
            transform: translateX(-100%);
            transition: transform 0.6s var(--ease);
            pointer-events: none;
        }

        .chapter-card:hover::before {
            transform: translateX(100%);
        }

        .chapter-card:hover {
            background: var(--surface-hover);
            border-color: var(--border-hover);
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .chapter-number {
            font-size: 2.25rem;
            font-weight: 800;
            color: var(--chapter-color, var(--primary));
            line-height: 1;
            letter-spacing: -0.04em;
        }

        .arrow {
            font-size: 1.25rem;
            color: var(--chapter-color, var(--primary));
            transition: transform 0.3s var(--ease);
        }

        .chapter-card:hover .arrow {
            transform: translate(4px, -4px);
        }

        .category {
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.15em;
            color: var(--chapter-color, var(--primary));
            margin-bottom: 0.25rem;
        }

        .chapter-card h2 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .chapter-card p {
            font-size: 0.85rem;
            color: var(--muted);
            line-height: 1.6;
        }

        /* Chapter colors */

        .chapter-card:nth-child(1) {
            --chapter-color: #d0bcff;
        }

        .chapter-card:nth-child(2) {
            --chapter-color: #79e2d0;
        }

        .chapter-card:nth-child(3) {
            --chapter-color: #ffcb85;
        }

        .chapter-card:nth-child(4) {
            --chapter-color: #f5a5df;
        }

        /* Footer */

        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: var(--muted);
            letter-spacing: 0.08em;
        }

        .footer-status {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #79e2d0;
            box-shadow: 0 0 10px #79e2d0;
        }

        /* ========================================
           Responsive
        ======================================== */

        @media (max-width: 680px) {
            html,
            body {
                overflow: auto;
            }

            .app-container {
                min-height: 100svh;
                height: auto;
                padding: 1.5rem 5vw;
            }

            main {
                grid-template-columns: 1fr;
                gap: 0.85rem;
                padding: 3rem 0;
            }

            .chapter-card {
                min-height: 150px;
                padding: 1.25rem 1.5rem;
            }

            .chapter-card p {
                display: none;
            }

            .chapter-number {
                font-size: 1.8rem;
            }

            .chapter-card h2 {
                font-size: 1.2rem;
            }

            .header-label {
                display: none;
            }

            footer {
                padding-bottom: 0.5rem;
            }
        }

        @media (max-height: 700px) and (min-width: 681px) {
            .app-container {
                padding-top: 1.25rem;
                padding-bottom: 1.25rem;
            }

            main {
                gap: 0.8rem;
                padding: 1rem 0;
            }

            .chapter-card {
                min-height: 150px;
                padding: 1.25rem 1.5rem;
            }

            .chapter-number {
                font-size: 1.8rem;
            }

            .chapter-card h2 {
                font-size: 1.15rem;
            }

            .chapter-card p {
                font-size: 0.8rem;
            }
        }

        /* Motion accessibility */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- Background -->
    <div class="background">
        <div class="ambient-glow"></div>
        <div id="three-container"></div>
        <canvas id="particles"></canvas>
    </div>

    <!-- Intro screen -->
    <div class="intro-screen">
        <div class="intro-title">WebExercises</div>
        <div class="intro-line"></div>
    </div>

    <!-- Main content -->
    <div class="app-container">

        <header>
            <span class="brand-icon">✳</span>
            <span class="brand-name">WebExercises</span>
            <span class="header-label">WEB DEVELOPMENT COURSE</span>
        </header>

        <main>

            <a href="./01/" class="chapter-card">
                <div>
                    <div class="card-top">
                        <span class="chapter-number">01</span>
                        <span class="arrow">↗</span>
                    </div>
                    <div class="category">STRUCTURE & STYLE</div>
                    <h2>HTML / CSS</h2>
                </div>
                <p>Webページの構造とデザインを学ぶ。</p>
            </a>

            <a href="./02/" class="chapter-card">
                <div>
                    <div class="card-top">
                        <span class="chapter-number">02</span>
                        <span class="arrow">↗</span>
                    </div>
                    <div class="category">INTERACTION</div>
                    <h2>JavaScript</h2>
                </div>
                <p>JavaScriptでWebページに動きをつける。</p>
            </a>

            <a href="./03/" class="chapter-card">
                <div>
                    <div class="card-top">
                        <span class="chapter-number">03</span>
                        <span class="arrow">↗</span>
                    </div>
                    <div class="category">VERSION CONTROL</div>
                    <h2>Git / GitHub</h2>
                </div>
                <p>変更履歴を管理し、開発の基礎を学ぶ。</p>
            </a>

            <a href="./04/" class="chapter-card">
                <div>
                    <div class="card-top">
                        <span class="chapter-number">04</span>
                        <span class="arrow">↗</span>
                    </div>
                    <div class="category">DATA & NETWORK</div>
                    <h2>API / DB</h2>
                </div>
                <p>データのやり取りと保存の仕組みを学ぶ。</p>
            </a>

        </main>

        <footer>
            <div class="footer-status">
                <span class="status-dot"></span>
                <span>ONLINE</span>
            </div>
            <span>WebExercises</span>
        </footer>

    </div>

    <script>
        /* ========================================
           1. Intro animation
        ======================================== */

        const intro = document.querySelector(".intro-screen");
        const introTitle = document.querySelector(".intro-title");
        const introLine = document.querySelector(".intro-line");
        const app = document.querySelector(".app-container");

        const reducedMotion = window.matchMedia(
            "(prefers-reduced-motion: reduce)"
        ).matches;

        if (reducedMotion) {
            intro.style.display = "none";
            app.style.visibility = "visible";
            app.style.opacity = "1";

            document.querySelectorAll(".chapter-card").forEach(card => {
                card.style.opacity = "1";
                card.style.transform = "none";
            });
        } else {
            anime.timeline({
                easing: "easeOutExpo"
            })
            .add({
                targets: introTitle,
                opacity: [0, 1],
                translateY: [20, 0],
                duration: 1200
            })
            .add({
                targets: introLine,
                width: ["0%", "45%"],
                duration: 900
            }, "-=700")
            .add({
                targets: introTitle,
                opacity: [1, 0],
                translateY: [0, -20],
                duration: 700,
                delay: 700
            })
            .add({
                targets: intro,
                opacity: [1, 0],
                duration: 800,
                complete: () => {
                    intro.style.display = "none";
                    showMain();
                }
            });
        }

        function showMain() {
            app.style.visibility = "visible";

            anime.timeline({
                easing: "easeOutExpo"
            })
            .add({
                targets: "header, footer",
                opacity: [0, 1],
                translateY: [-10, 0],
                duration: 800
            })
            .add({
                targets: ".chapter-card",
                opacity: [0, 1],
                translateY: [20, 0],
                delay: anime.stagger(120),
                duration: 900
            }, "-=500")
            .finished.then(() => {
                app.style.opacity = "1";
            });
        }

        /* ========================================
           2. Particle system
        ======================================== */

        const canvas = document.getElementById("particles");
        const ctx = canvas.getContext("2d");

        let width;
        let height;
        let particles = [];

        const particleCount = 500;

        const mouse = {
            x: -1000,
            y: -1000,
            active: false
        };

        function resizeCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);

            width = window.innerWidth;
            height = window.innerHeight;

            canvas.width = width * dpr;
            canvas.height = height * dpr;

            canvas.style.width = width + "px";
            canvas.style.height = height + "px";

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        class Particle {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial
                    ? Math.random() * height
                    : height + Math.random() * 30;

                this.radius = Math.random() * 1.8 + 0.5;

                this.alpha = Math.random() * 0.5 + 0.2;
                this.phase = Math.random() * Math.PI * 2;

                this.vx = (Math.random() - 0.5) * 0.25;
                this.vy = -(Math.random() * 0.25 + 0.05);
            }

            update(time) {
                this.phase += 0.015;

                this.x += this.vx;
                this.y += this.vy;

                // Mouse interaction
                if (mouse.active) {
                    const dx = this.x - mouse.x;
                    const dy = this.y - mouse.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    const influenceRadius = 500;

                    if (distance < influenceRadius && distance > 0) {
                        const force = (influenceRadius - distance)
                            / influenceRadius;

                        this.x += (dx / distance) * force * 1.5;
                        this.y += (dy / distance) * force * 1.5;
                    }
                }

                // Screen boundary
                if (
                    this.x < -20 ||
                    this.x > width + 20 ||
                    this.y < -20
                ) {
                    this.reset();
                }
            }

            draw() {
                const flicker = 0.5 + Math.sin(this.phase) * 0.5;
                const alpha = this.alpha * flicker;

                // Glow
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 4, 0, Math.PI * 2);

                const glow = ctx.createRadialGradient(
                    this.x,
                    this.y,
                    0,
                    this.x,
                    this.y,
                    this.radius * 4
                );

                glow.addColorStop(0, `rgba(208,188,255,${alpha * 0.4})`);
                glow.addColorStop(1, "rgba(208,188,255,0)");

                ctx.fillStyle = glow;
                ctx.fill();

                // Particle core
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(230,220,255,${alpha})`;
                ctx.fill();
            }
        }

        function initParticles() {
            resizeCanvas();

            particles = [];

            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            // Clear previous frame gradually.
            // This creates the particle trails.
            ctx.fillStyle = "rgba(12, 9, 20, 0.13)";
            ctx.fillRect(0, 0, width, height);

            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            requestAnimationFrame(animateParticles);
        }

        window.addEventListener("resize", resizeCanvas);

        window.addEventListener("pointermove", event => {
            mouse.x = event.clientX;
            mouse.y = event.clientY;
            mouse.active = true;
        });

        window.addEventListener("pointerleave", () => {
            mouse.active = false;
        });

        initParticles();

        if (!reducedMotion) {
            animateParticles();
        }

    </script>

    <!-- ========================================
         3. Three.js wireframe objects
    ========================================= -->

    <script type="module">
        import * as THREE from "three";

        const container = document.getElementById("three-container");

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            55,
            window.innerWidth / window.innerHeight,
            0.1,
            100
        );

        camera.position.z = 8;

        const renderer = new THREE.WebGLRenderer({
            alpha: true,
            antialias: true
        });

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        );

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        container.appendChild(renderer.domElement);

        /* ----------------------------------------
           Wireframe objects
        ---------------------------------------- */

        const objects = [];

        function createWireObject(geometry, color, opacity) {
            const edges = new THREE.EdgesGeometry(geometry);

            const material = new THREE.LineBasicMaterial({
                color: color,
                transparent: true,
                opacity: opacity
            });

            const wireframe = new THREE.LineSegments(
                edges,
                material
            );

            scene.add(wireframe);
            objects.push(wireframe);

            return wireframe;
        }

        // Large icosahedron
        const sphere = createWireObject(
            new THREE.IcosahedronGeometry(2.1, 2),
            0x9b7bea,
            0.24
        );

        sphere.position.set(3.1, 0.4, -2);

        // Torus knot
        const torus = createWireObject(
            new THREE.TorusKnotGeometry(1.1, 0.012, 160, 8, 2, 3),
            0x79e2d0,
            0.55
        );

        torus.position.set(-3.4, -1.2, -1.5);
        torus.scale.setScalar(0.9);

        // Small icosahedron
        const smallSphere = createWireObject(
            new THREE.IcosahedronGeometry(0.8, 1),
            0xf5a5df,
            0.4
        );

        smallSphere.position.set(-2.5, 2.4, -2);

        /* ----------------------------------------
           Mouse interaction
        ---------------------------------------- */

        const pointer = {
            x: 0,
            y: 0
        };

        window.addEventListener("pointermove", event => {
            pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        /* ----------------------------------------
           Animation loop
        ---------------------------------------- */

        const clock = new THREE.Clock();

        function render() {
            requestAnimationFrame(render);

            const elapsed = clock.getElapsedTime();

            if (!window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            ).matches) {
                sphere.rotation.x = elapsed * 0.08;
                sphere.rotation.y = elapsed * 0.12;

                torus.rotation.x = elapsed * 0.1;
                torus.rotation.y = elapsed * 0.15;

                smallSphere.rotation.x = elapsed * -0.12;
                smallSphere.rotation.y = elapsed * 0.1;

                // Mouse-driven camera movement
                camera.position.x += (
                    pointer.x * 0.45 - camera.position.x
                ) * 0.025;

                camera.position.y += (
                    pointer.y * 0.35 - camera.position.y
                ) * 0.025;
            }

            renderer.render(scene, camera);
        }

        render();

        /* ----------------------------------------
           Resize
        ---------------------------------------- */

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        });
    </script>

</body>
</html>
