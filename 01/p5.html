<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>リスト</title>
</head>
<body>

    <h1>プログラミング学習</h1>

    <h2>学習に必要なもの</h2>

    <!--
    ここを埋める：順序のないリスト
    以下の3つをリスト項目にする
    -->
    <ul>
        <!-- ここを埋める -->
        <!-- ここを埋める -->
        <!-- ここを埋める -->
    </ul>

    <h2>学習の手順</h2>

    <!--
    ここを埋める：順序のあるリスト
    以下の3つをリスト項目にする
    -->
    <ol>
        <!-- ここを埋める -->
        <!-- ここを埋める -->
        <!-- ここを埋める -->
    </ol>

</body>
</html>
