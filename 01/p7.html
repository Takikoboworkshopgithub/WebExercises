<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>divとclass</title>

    <style>
        /*
        ここを埋める：
        topクラスのデザイン
        */

        /*
        ここを埋める：
        menuクラスのデザイン
        */

        /*
        ここを埋める：
        contentクラスのデザイン
        */
    </style>
</head>
<body>

    <div class="top">
        <h1>My Web Site</h1>
        <p>Web開発の練習サイトです。</p>
    </div>

    <div class="menu">
        <h2>Menu</h2>
        <ul>
            <li>ホーム</li>
            <li>プロフィール</li>
            <li>お問い合わせ</li>
        </ul>
    </div>

    <div class="content">
        <h2>Welcome!</h2>
        <p>
            これはdiv要素を使ったWebページです。
            classを指定することで、領域ごとに異なるCSSを適用できます。
        </p>
    </div>

</body>
</html>
