<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>CSSの基本</title>

    <style>
        h1 {
            color: blue;
            font-size: 40px;
        }

        p {
            background-color: lightblue;
        }
    </style>
</head>
<body>

    <h1>CSSを使ってみよう</h1>

    <p>
        CSSを使うと、Webページの見た目を変更できます。
    </p>

    <p>
        文字の色や大きさ、背景色などを自由に設定できます。
    </p>

</body>
</html>
