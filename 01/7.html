<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>divとclass</title>

    <style>
        .top {
            background-color: #26364a;
            color: white;
            padding: 24px;
        }

        .menu {
            background-color: #e8edf3;
            padding: 16px;
            width: 200px;
            float: left;
        }

        .content {
            background-color: #f5f7fa;
            padding: 24px;
            margin-left: 232px;
            min-height: 200px;
        }
    </style>
</head>
<body>

    <div class="top">
        <h1>My Web Site</h1>
        <p>Web開発の練習サイトです。</p>
    </div>

    <div class="menu">
        <h2>Menu</h2>
        <ul>
            <li>ホーム</li>
            <li>プロフィール</li>
            <li>お問い合わせ</li>
        </ul>
    </div>

    <div class="content">
        <h2>Welcome!</h2>
        <p>
            これはdiv要素を使ったWebページです。
            classを指定することで、領域ごとに異なるCSSを適用できます。
        </p>
    </div>

</body>
</html>
