<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2. 3の倍数または3が含まれる数字</title>
</head>
<body>
  <h1>3の倍数または3が含まれる数字</h1>
  <p>数字を入力してください。</p>
  <input id="num" type="number">
  <button onclick="check()">判定</button>

  <script>
    function check() {
      const num = Number(document.getElementById("num").value);

      if (num % 3 === 0 || String(num).includes("3")) {
        alert("バカになった！");
      }
    }
  </script>
</body>
</html>
