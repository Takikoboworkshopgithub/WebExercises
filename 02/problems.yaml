
- id: 1
  title: "カウンター"
  description: |
    ボタンをクリックすると、画面に表示されている数字が1ずつ増えるカウンターを作成しましょう。
  instructions:
    - "letを使って、カウンターの初期値を0にしてください。"
    - "ボタンをクリックしたときに、カウンターの値を1増やしてください。"
    - "変更した値を画面に表示してください。"

- id: 2
  title: "3の倍数と3のつく数字"
  description: |
    入力された数字が、3の倍数または数字の中に3が含まれているかを判定しましょう。
  instructions:
    - "入力された数字を取得してください。"
    - "if文を使って、3の倍数かどうかを判定してください。"
    - "文字列のincludes()を使って、数字に3が含まれているか判定してください。"
    - "判定結果を画面に表示してください。"

- id: 3
  title: "商品価格の検索"
  description: |
    オブジェクトに登録された商品価格を、商品名から検索して表示しましょう。
  instructions:
    - "商品名をキー、価格を値とするオブジェクトを用意してください。"
    - "入力された商品名を使って、オブジェクトから価格を取得してください。"
    - "商品が存在しない場合は、そのことを画面に表示してください。"

- id: 4
  title: "背景色の切り替え"
  description: |
    ボタンをクリックするたびに、ページの背景色を白と黒に切り替えましょう。
  instructions:
    - "現在の背景色を変数で管理してください。"
    - "ボタンのクリックイベントを設定してください。"
    - "背景色を白と黒で切り替えてください。"

- id: 5
  title: "キーボード操作"
  description: |
    上下の矢印キーを押すと、画面に表示された文章の文字色が切り替わるようにしましょう。
  instructions:
    - "文章を取得して、配列に保存してください。"
    - "keydownイベントでキーの入力を取得してください。"
    - "ArrowUpとArrowDownで処理を分けてください。"
    - "for文を使って、文章の文字色を変更してください。"

- id: 6
  title: "アクティブ要素の切り替え"
  description: |
    矢印キーを使って、選択中の要素を切り替えましょう。
  instructions:
    - "複数の要素を取得してください。"
    - "現在選択されている要素の番号を変数で管理してください。"
    - "矢印キーを押したときに、選択する要素を変更してください。"
    - "classListを使って、activeクラスを切り替えてください。"

- id: 7
  title: "HTMLの書き換え"
  description: |
    ボタンをクリックすると、HTML要素の内容が書き換わるようにしましょう。
  instructions:
    - "変更したいHTML要素を取得してください。"
    - "ボタンのクリックイベントを設定してください。"
    - "innerHTMLを使って、要素の内容を書き換えてください。"

- id: 8
  title: "要素の追加"
  description: |
    ボタンをクリックすると、新しいHTML要素が画面に追加されるようにしましょう。
  instructions:
    - "createElement()を使って、新しい要素を作成してください。"
    - "作成した要素に文章を設定してください。"
    - "appendChild()を使って、画面に要素を追加してください。"

- id: 9
  title: "10秒チャレンジ"
  description: |
    指定された時間にできるだけ近いタイミングで、ストップボタンを押すゲームを作成しましょう。
    難易度によって目標時間が変わります。
  instructions:
    - "難易度を選択するボタンを用意してください。"
    - "難易度1は5秒、難易度2は10秒、難易度3は20秒を目標時間にしてください。"
    - "スタートボタンを押したときの時刻をDateオブジェクトで取得してください。"
    - "ストップボタンを押したときの時刻との差から、経過時間を計算してください。"
    - "目標時間との誤差を画面に表示してください。"
