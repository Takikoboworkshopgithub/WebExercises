<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>7. HTMLの書き換え</title>
</head>
<body>
  <div id="content">変更前</div>
  <button id="btn">変更</button>

  <script>
    function change() {
      // ここを穴埋め（innerHTMLを使います）
    }

    document.getElementById("btn").addEventListener("click", change);
  </script>
</body>
</html>
